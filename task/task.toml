artifacts = ["/app/output/domain_cif.csv"]

[task]
name = "dynamo/domain-cif"
description = "Publish identified domain cumulative incidence at a fixed horizon from follow-up with competing events, leaving unidentified and empty domains blank."

[metadata]
category = "Scientific Computing and Domain Science"
subcategory = "Statistical Modeling"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact", "mathematical_or_scientific_model"]
difficulty_explanation = "Survey follow-up statisticians who publish domain cumulative incidence in the presence of competing events are the practitioners for this workflow. The microdata are synthetic household extracts split across listings, onset and listing dates, event times, event types, and a listing-to-publish crosswalk. Most fit trees list every household on its onset day. One fit tree delays listing after onset so origin-recomputed survival and delayed-entry survival diverge on that worked table. Production also delays listing after onset. Difficulty is composing the competing-event product-limit incidence recovered from fit with a linearized SE that reuses delayed-entry survival and substitutes only the origin at-risk count. Fit case_00 has no competing events, so a one-minus-survival table looks plausible. Other fit trees discriminate independent-censoring siblings. Nothing in the environment reports superpopulation parameters. There is no fit-digest checker."
expert_time_estimate_hours = 1.0
solution_explanation = "Map each household to the publish domain of its listing domain. Time is days since onset. A household is at risk for incidence on day t when listing minus onset is strictly less than t and t is at most event minus onset. At each day through 90, form type-1 and type-2 hazard increments from that delayed-entry at-risk count, and accumulate type-1 incidence with the product-limit survival through both event types. Linearize the type-1 Greenwood increment on the origin at-risk count, as if listing equaled onset, while keeping that delayed-entry product-limit survival. Do not re-estimate survival under the origin risk set. Mark a domain empty when it has no household, unidentified when no household enters the delayed-entry risk set before day 90, and identified otherwise. Quantize identified estimates to 6 decimal places with round-half-even. Apply the same estimator to production, where listing can follow onset. Best-case expert time is about 1 focused hour for a senior follow-up statistician who already knows the approach."
verification_explanation = "Tests pin production inputs against a verifier-side copy under /tests/inputs/production, recompute the closed-form estimator independently, and require exact CSV equality on domain order, identification status, blank fields for empty and unidentified rows, and 6-decimal incidence and standard errors. Output bytes must use LF newlines with no carriage returns. Exact match is appropriate because risk sets, hazard increments, and the linearized variance are determined functions of the inputs. Wrong-model tables for independent-censoring one-minus-survival, origin risk sets that ignore delayed listing, both mistakes together, report-domain overlap, and delayed-entry Greenwood SEs must diverge. Fit cases ship worked published tables and must not ship a digest checker."

