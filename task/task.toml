artifacts = ["/app/output/domain_estimates.csv"]

[task]
name = "dynamo/domain-rates"
description = "Publish finite-population domain rates and census-denominator totals from a two-stage household sample with nonresponse, a phase-two subsample, calibration, and composite small-area prediction."

[metadata]
category = "Scientific Computing and Domain Science"
subcategory = "Statistical Modeling"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact", "mathematical_or_scientific_model"]
difficulty_explanation = "Survey methodologists and small-area statisticians are the practitioners who publish these domain estimates in the real world at census bureaus and national statistical offices. The microdata are synthetic two-stage household extracts built for this task, with design weights, unit nonresponse, a phase-two outcome subsample, item missingness, census margins, and unsampled domains. Difficulty is composing the unique closed-form estimand in /app/docs/CONTRACT.md: weighting-cell nonresponse, phase-two factors, item-cell imputation, linear calibration, ratio directs, with-replacement ultimate-cluster psi, unit-level WLS synthetics, and the Prasad and Rao 1990 leverage-corrected A with zero truncation. Fit case_00 is a well-behaved extract where naive domain means look plausible, so a green schema check is not evidence that production is right. Production combines informative sampling, differential nonresponse, crossing domains, sparse domains, and empty domains. Nothing in the environment reports superpopulation parameters. The check-only probe never writes goldens and refuses production."
expert_time_estimate_hours = 3.0
solution_explanation = "Build analysis weights as design weight times the urban-by-region unit-nonresponse factor times the phase-two factor, then apply Deville-Sarndal linear g-weights to census household margins. Impute missing y with the unweighted tenure-by-urban observed mean. Form Hajek direct rates and with-replacement PSU linearized psi, fit calibrated WLS for the synthetic, estimate A with the Prasad and Rao 1990 moment formula truncated at 0, and publish gamma times direct plus one minus gamma times synthetic. Multiply the 6-decimal quantized rate by census eligible-person counts, then quantize totals to 2 decimals. Apply the same estimator to production /app/data. Best-case expert time is about 3 focused hours for a senior survey statistician who already knows the approach."
verification_explanation = "Tests pin production inputs against a verifier-side copy under /tests/inputs/production, recompute the closed-form estimator independently, and require exact CSV equality on domain order, 6-decimal rates, and 2-decimal totals after the documented rate-first rounding. Exact match is appropriate because weighting cells, linear g-weights, ratio linearization, WLS, and Prasad-Rao A are determined functions of the inputs. Wrong-model contrasts for unweighted means, mean-of-ratios, and always-direct tables must diverge. sae_ref must refuse /app/data, accept a correct fit candidate, and refuse a mutated fit tree. Fit cases must ship inputs only."

