artifacts = ["/app/output/domain_contrasts.csv"]

[task]
name = "dynamo/domain-ate"
description = "Publish identified finite-population domain program contrasts from a two-stage household sample, leaving unidentified and empty domains blank."

[metadata]
category = "Scientific Computing and Domain Science"
subcategory = "Statistical Modeling"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["analyze", "generate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact", "mathematical_or_scientific_model"]
difficulty_explanation = "Survey statisticians who publish finite-population program contrasts are the practitioners for this workflow. The microdata are synthetic two-stage household extracts split across listings, interviews, roster, and a listing-to-publish crosswalk, with duplicate listings, design weights, unit nonresponse, a phase-two subsample, item missingness, a binary program arm, and census domains that include empty and single-arm geographies. Difficulty is inducing the unique construction of response adjustments, item completion, linear calibration, and cluster standard errors from non-isomorphic fit published tables, then composing that construction with positivity on the published domain and the analysis-weighted mean of household y per eligible person. Fit case_00 is a complete-response identity extract where a fully populated numeric table looks plausible. Other fit trees ship worked published tables that discriminate construction siblings. Production densifies informative sampling, many-to-one recodes that can create overlap, listing multiplicity, and domains that must stay unidentified or empty. Nothing in the environment reports superpopulation parameters. There is no fit-digest checker."
expert_time_estimate_hours = 3.0
solution_explanation = "Collapse duplicate listings, left-join interviews, take publish domain from the listing crosswalk, and drop phase-two households with no roster row. Build analysis weights as design weight times the urban-by-region unit-nonresponse household-count factor times the phase-two household-count factor, then apply linear g-weights to census household margins. Impute missing y with the unweighted tenure-by-urban observed mean. Mark a domain empty when it has no analysis household, unidentified when it lacks both program arms or a positive calibrated eligible-person total on either arm, and identified only when positivity holds on the published domain. For identified domains publish the analysis-weighted mean of household y per eligible person as treated minus control, with a with-replacement PSU linearized standard error. Leave numeric fields empty otherwise. Apply the same estimator to production /app/data. Best-case expert time is about 3 focused hours for a senior survey statistician who already knows the approach."
verification_explanation = "Tests pin production inputs against a verifier-side copy under /tests/inputs/production, recompute the closed-form estimator independently, and require exact CSV equality on domain order, identification status, blank fields for empty and unidentified rows, and 6-decimal contrasts and cluster SEs. Exact match is appropriate because construction, positivity, linear g-weights, weighted means of household rates, and the linearized contrast variance are determined functions of the inputs. Wrong-model contrasts for ratio-of-totals Hajek, always-filled unweighted gaps, interview-domain overlap, listing-domain overlap, design-weight-sum response factors, and intercept-plus-urban calibration without region dummies must diverge. Fit cases ship worked published tables and must not ship a digest checker."

